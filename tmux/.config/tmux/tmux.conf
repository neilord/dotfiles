# Options

set -g mouse on
set -sg escape-time 0
set -g focus-events on # lets Neovim reload files changed outside it
set -g display-panes-time 2000
set -g history-limit 10000

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:usstyle" # true color, and curly colored underlines for Neovim diagnostics

# Use 1 based indexing, with no gaps: the bar spots the last window by its number
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi mode
set -g status-keys vi
setw -g mode-keys vi

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on

# Key Bindings (prefix stays C-b)

bind -n S-Left  previous-window
bind -n S-Right next-window

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Theme
# ~/.config/theme/theme sets the @thm_* colors below, the border and message styles, and the terminal's
# own colors. It runs on every attach, and Neovim's <leader>tt picker runs it to switch theme.

set -g status-style NONE
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#[fg=#{@thm_on_accent},bg=#{@thm_accent},bold] #S #[fg=#{@thm_accent},bg=#{@thm_dark}]"
set -g status-right "#[fg=#{@thm_surface}]#[fg=#{@thm_accent},bg=#{@thm_surface}] %Y-%m-%d  %H:%M #[fg=#{@thm_accent},bg=#{@thm_surface}]#[fg=#{@thm_on_accent},bg=#{@thm_accent},bold] #h "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@thm_muted},bg=#{@thm_dark}]  #[#{?window_last_flag,bold,none}]#I #W#[nobold] #[fg=#{@thm_dark},bg=#{?#{==:#I,#{session_windows}},default,#{@thm_dark}}]"
setw -g window-status-current-format "#[fg=#{@thm_dark},bg=#{@thm_surface},bold] #[fg=#{@thm_accent}]#I #W #[fg=#{@thm_surface},bg=#{?#{==:#I,#{session_windows}},default,#{@thm_dark}}]"

set-hook -g client-attached 'run-shell -b "~/.config/theme/theme sync"'
run-shell -b "~/.config/theme/theme sync"
